<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd Quarter Drill2</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .output-box {
            background-color: #ffffff;
            border-left: 4px solid #0d6efd;
            border-radius: 6px;
        }
        .member-badge {
            display: inline-block;
            background-color: #e9ecef;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <!-- Card Container -->
                <div class="card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Club Membership</h2>
                        <p class="text-muted">Add a new member to update the dynamic directory</p>
                    </div>

                    <!-- Input Form -->
                    <form onsubmit="return false;">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="first_name" class="form-label fw-semibold">First Name</label>
                                <input type="text" id="first_name" class="form-control" placeholder="e.g. Taranbir" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="last_name" class="form-label fw-semibold">Last Name</label>
                                <input type="text" id="last_name" class="form-control" placeholder="e.g. Singh" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <input type="button" value="Add Member" py-click="result_checker" class="btn btn-primary btn-lg shadow-sm">
                        </div>
                    </form>

                    <!-- Results Output -->
                    <div id="output" class="output-box p-3 mt-4 text-secondary">
                        <small class="text-muted d-block text-center">Submitted member details and updated list will appear here.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
